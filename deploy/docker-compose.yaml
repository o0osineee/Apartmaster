services:
  mysql:
    image: mysql:8.0
    container_name: apartmaster-mysql
    restart: unless-stopped
    env_file:
      - .env
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Schema, migrations and sample data, imported once (in this order) by
      # deploy/mysql-init/00-run-sql.sh the first time the volume is empty.
      - ../apartmentBE/database/createdb.sql:/docker-entrypoint-initdb.d/sql/01-createdb.sql:ro
      - ../apartmentBE/database/migrations/add_fee_details_to_bill.sql:/docker-entrypoint-initdb.d/sql/02-add_fee_details_to_bill.sql:ro
      - ../apartmentBE/database/migrations/add_isread_to_notification.sql:/docker-entrypoint-initdb.d/sql/03-add_isread_to_notification.sql:ro
      - ../apartmentBE/database/sampledb.sql:/docker-entrypoint-initdb.d/sql/04-sampledb.sql:ro
      - ./mysql-init/sql/99-hash-passwords.sql:/docker-entrypoint-initdb.d/sql/99-hash-passwords.sql:ro
      - ./mysql-init/00-run-sql.sh:/docker-entrypoint-initdb.d/00-run-sql.sh:ro
    networks:
      - apartmaster-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ../apartmentBE
      dockerfile: Dockerfile
    container_name: apartmaster-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 3001
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${BE_PORT:-3001}:3001"
    networks:
      - apartmaster-net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ../apartmentFE
      dockerfile: Dockerfile
    container_name: apartmaster-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FE_PORT:-8080}:80"
    networks:
      - apartmaster-net

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: apartmaster-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    networks:
      - apartmaster-net

volumes:
  mysql_data:

networks:
  apartmaster-net:
    driver: bridge
