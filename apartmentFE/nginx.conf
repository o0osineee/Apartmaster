# The built SPA calls a relative "/api" base URL (see src/api/config.js).
# In dev that's handled by Vite's proxy; here nginx plays the same role,
# forwarding to the "backend" container on the compose network.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing: let React Router handle unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }
}
