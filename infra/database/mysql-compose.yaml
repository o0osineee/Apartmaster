services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    env_file:
      - ../.env.dev
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      # Schema, migrations and sample data — imported once (in this order) by
      # deploy/mysql-init/00-run-sql.sh the first time the volume is empty.
      # Shared with deploy/docker-compose.yaml so both paths seed identically.
      - ../../apartmentBE/database/createdb.sql:/docker-entrypoint-initdb.d/sql/01-createdb.sql:ro
      - ../../apartmentBE/database/migrations/add_fee_details_to_bill.sql:/docker-entrypoint-initdb.d/sql/02-add_fee_details_to_bill.sql:ro
      - ../../apartmentBE/database/migrations/add_isread_to_notification.sql:/docker-entrypoint-initdb.d/sql/03-add_isread_to_notification.sql:ro
      - ../../apartmentBE/database/sampledb.sql:/docker-entrypoint-initdb.d/sql/04-sampledb.sql:ro
      - ../../deploy/mysql-init/sql/99-hash-passwords.sql:/docker-entrypoint-initdb.d/sql/99-hash-passwords.sql:ro
      - ../../deploy/mysql-init/00-run-sql.sh:/docker-entrypoint-initdb.d/00-run-sql.sh:ro
    networks:
      - apartmaster-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8082:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    networks:
      - apartmaster-net

volumes:
  mysql_data:
networks:
  apartmaster-net:
    driver: bridge
